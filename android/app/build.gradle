plugins { id 'com.android.application' }

def buildNo = (System.getenv('BUILD_NUMBER') ?: '1').toInteger()

android {
    namespace 'app.amasgazamson.transport'
    compileSdk 34

    defaultConfig {
        applicationId 'app.amasgazamson.transport'
        minSdk 24
        targetSdk 34
        versionCode buildNo
        versionName "1.0.${buildNo}"
        buildConfigField 'String', 'START_URL', '"https://amasgazamson.vercel.app/"'
        buildConfigField 'String', 'APP_HOST', '"amasgazamson.vercel.app"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks && new File(ks).exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
